<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPG Combat — Commit Viewer</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --dim: #8b949e;
    --accent: #58a6ff;
    --red: #f85149;
    --green: #3fb950;
    --purple: #a371f7;
    --gray: #6e7681;
    --add-bg: rgba(46, 160, 67, 0.15);
    --add-text: #aff5b4;
    --del-bg: rgba(248, 81, 73, 0.13);
    --del-text: #ffdcd7;
    --hunk-bg: rgba(56, 139, 253, 0.12);
    --hunk-text: #d2a8ff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }
  .chrome {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    flex-wrap: wrap;
  }
  .title {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
  }
  .title .sub { color: var(--dim); font-weight: 400; }
  .tabs { display: flex; gap: 8px; }
  .tab {
    font: inherit;
    font-size: 13px;
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--dim);
    cursor: pointer;
  }
  .tab:hover { color: var(--text); border-color: var(--dim); }
  .tab.active {
    background: var(--panel);
    color: var(--text);
    border-color: var(--accent);
  }
  .tab .count { color: var(--dim); font-size: 12px; margin-left: 6px; }
  .spacer { flex: 1; }
  .keys { color: var(--dim); font-size: 12px; white-space: nowrap; }
  kbd {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    margin: 0 1px;
  }
  .timeline {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    padding: 6px 20px 10px;
    height: 34px;
  }
  .tick {
    flex: 1;
    min-width: 3px;
    max-width: 26px;
    height: 12px;
    border-radius: 2px;
    cursor: pointer;
    opacity: 0.45;
    border: none;
    padding: 0;
  }
  .tick:hover { opacity: 0.9; height: 16px; }
  .tick.active { opacity: 1; height: 18px; outline: 1px solid var(--text); }
  .tick.red { background: var(--red); }
  .tick.green { background: var(--green); }
  .tick.refactor { background: var(--purple); }
  .tick.chore { background: var(--gray); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .commit-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .commit-nav {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .navbtn {
    font: inherit;
    font-size: 13px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 12px;
    cursor: pointer;
  }
  .navbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .navbtn:disabled { opacity: 0.35; cursor: default; }
  .counter { font-family: var(--mono); font-size: 13px; color: var(--dim); }
  .badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 2px 9px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .badge.red { background: rgba(248, 81, 73, 0.18); color: var(--red); }
  .badge.green { background: rgba(63, 185, 80, 0.18); color: var(--green); }
  .badge.refactor { background: rgba(163, 113, 247, 0.18); color: var(--purple); }
  .badge.chore { background: rgba(110, 118, 129, 0.25); color: var(--dim); }
  .subject { font-size: 18px; font-weight: 600; margin: 2px 0 8px; }
  .meta {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    color: var(--dim);
    font-size: 13px;
    align-items: center;
  }
  .meta .hash { font-family: var(--mono); color: var(--accent); }
  .meta .adds { color: var(--green); font-family: var(--mono); }
  .meta .dels { color: var(--red); font-family: var(--mono); }
  .body-text {
    margin: 10px 0 0;
    white-space: pre-wrap;
    color: var(--dim);
    font-size: 13px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .file {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: clip; /* clips rounded corners without becoming the sticky header's scrollport */
  }
  .file-header {
    position: sticky;
    top: var(--chrome-h, 92px);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 7px 12px;
    font-family: var(--mono);
    font-size: 13px;
  }
  .file-status { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
  .file-status.added { color: var(--green); background: rgba(63, 185, 80, 0.18); }
  .file-status.deleted { color: var(--red); background: rgba(248, 81, 73, 0.18); }
  .file-status.modified { color: var(--accent); background: rgba(88, 166, 255, 0.15); }
  .diff-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
  .diff-table td { padding: 0 10px 0 0; vertical-align: top; }
  td.ln {
    width: 1%;
    min-width: 42px;
    text-align: right;
    color: var(--dim);
    opacity: 0.6;
    user-select: none;
    padding: 0 8px;
    white-space: nowrap;
  }
  td.code { white-space: pre-wrap; word-break: break-word; width: 100%; }
  tr.add { background: var(--add-bg); }
  tr.add td.code { color: var(--add-text); }
  tr.del { background: var(--del-bg); }
  tr.del td.code { color: var(--del-text); }
  tr.hunk { background: var(--hunk-bg); }
  tr.hunk td.code { color: var(--hunk-text); padding: 3px 10px 3px 0; }
  tr.metaline td.code { color: var(--dim); font-style: italic; }
  .legend {
    display: flex;
    gap: 16px;
    align-items: center;
    color: var(--dim);
    font-size: 12px;
    padding: 0 20px 10px;
  }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: baseline; }
  .empty { color: var(--dim); font-style: italic; padding: 30px; text-align: center; }
  footer { color: var(--dim); font-size: 12px; text-align: center; padding: 10px 0 30px; }
</style>
</head>
<body>
<div class="chrome" id="chrome">
  <div class="topbar">
    <div class="title">RPG Combat <span class="sub">— commit viewer</span></div>
    <div class="tabs" id="tabs"></div>
    <div class="spacer"></div>
    <div class="keys"><kbd>←</kbd><kbd>→</kbd> step &nbsp; <kbd>Home</kbd><kbd>End</kbd> jump &nbsp; <kbd>1</kbd><kbd>2</kbd> switch folder</div>
  </div>
  <div class="timeline" id="timeline"></div>
  <div class="legend">
    <span><span class="dot" style="background:var(--red)"></span>test / red</span>
    <span><span class="dot" style="background:var(--green)"></span>feat / green</span>
    <span><span class="dot" style="background:var(--purple)"></span>refactor</span>
    <span><span class="dot" style="background:var(--gray)"></span>chore</span>
  </div>
</div>
<main>
  <div class="commit-card">
    <div class="commit-nav">
      <button class="navbtn" id="prev">‹ Prev</button>
      <button class="navbtn" id="next">Next ›</button>
      <span class="counter" id="counter"></span>
      <span class="spacer"></span>
      <span class="badge" id="badge"></span>
    </div>
    <div class="subject" id="subject"></div>
    <div class="meta">
      <span class="hash" id="hash"></span>
      <span id="date"></span>
      <span id="author"></span>
      <span id="filecount"></span>
      <span class="adds" id="adds"></span>
      <span class="dels" id="dels"></span>
    </div>
    <div class="body-text" id="bodytext" hidden></div>
  </div>
  <div id="diff"></div>
</main>
<footer>Only commits touching <code>src/</code> or <code>tests/</code> are shown; diffs are restricted to those paths.</footer>

"body": "", "type": "refactor", "adds": 1, "dels": 1, "files": 1, "diff": "diff --git a/lexler/src/character.ts b/lexler/src/character.ts\nindex 0fcd1c9..1d9c249 100644\n--- a/lexler/src/character.ts\n+++ b/lexler/src/character.ts\n@@ -12,7 +12,7 @@ export class Character {\n     this.health += amount;\n   }\n \n-  receiveDamage(amount: number): void {\n+  private receiveDamage(amount: number): void {\n     this.health -= amount;\n     if (this.health <= 0) {\n       this.health = 0;\n"}, {"hash": "623eb00", "full": "623eb002b3e0dca1a06c91d9f43a4ee085db1379", "author": "Lada Kesseler", "date": "2026-05-28 13:34", "subject": "test(red): a new character starts at level 1", "body": "", "type": "red", "adds": 5, "dels": 0, "files": 1, "diff": "diff --git a/lexler/tests/character.test.ts b/lexler/tests/character.test.ts\nindex 3a8f5af..45ac935 100644\n--- a/lexler/tests/character.test.ts\n+++ b/lexler/tests/character.test.ts\n@@ -55,4 +55,9 @@ describe('Character', () => {\n     expect(character.isAlive).toBe(false);\n   });\n \n+  it('starts at level 1', () => {\n+    const character = new Character();\n+\n+    expect(character.level).toBe(1);\n+  });\n });\n"}, {"hash": "4e49d21", "full": "4e49d2168fbfeabe5d943ab6a49c79dc79fff5be", "author": "Lada Kesseler", "date": "2026-05-28 13:35", "subject": "feat(green): characters have a level starting at 1", "body": "", "type": "green", "adds": 1, "dels": 0, "files": 1, "diff": "diff --git a/lexler/src/character.ts b/lexler/src/character.ts\nindex 1d9c249..a9ba1b1 100644\n--- a/lexler/src/character.ts\n+++ b/lexler/src/character.ts\n@@ -1,6 +1,7 @@\n export class Character {\n   health = 1000;\n   isAlive = true;\n+  level = 1;\n \n   dealDamage(target: Character, amount: number): void {\n     if (target === this) return;\n"}, {"hash": "7fcc38b", "full": "7fcc38b7b75fe3bc5eb352642dd6a9dc11b25871", "author": "Lada Kesseler", "date": "2026-05-28 13:36", "subject": "test(red): damage is halved when target is 5+ levels above attacker", "body": "", "type": "red", "adds": 14, "dels": 1, "files": 2, "diff": "diff --git a/lexler/src/character.ts b/lexler/src/character.ts\nindex a9ba1b1..262002d 100644\n--- a/lexler/src/character.ts\n+++ b/lexler/src/character.ts\n@@ -1,7 +1,11 @@\n export class Character {\n   health = 1000;\n   isAlive = true;\n-  level = 1;\n+  level: number;\n+\n+  constructor(options: { level?: number } = {}) {\n+    this.level = options.level ?? 1;\n+  }\n \n   dealDamage(target: Character, amount: number): void {\n     if (target === this) return;\ndiff --git a/lexler/tests/character.test.ts b/lexler/tests/character.test.ts\nindex 45ac935..9316a29 100644\n--- a/lexler/tests/character.test.ts\n+++ b/lexler/tests/character.test.ts\n@@ -60,4 +60,13 @@ describe('Character', () => {\n \n     expect(character.level).toBe(1);\n   });\n+\n+  it('deals half damage when target is 5+ levels above attacker', () => {\n+    const attacker = new Character();\n+    const target = new Character({ level: 6 });\n+\n+    attacker.dealDamage(target, 100);\n+\n+    expect(target.health).toBe(950);\n+  });\n });\n"}, {"hash": "39a8087", "full": "39a80878f1f58020ae0c17958506c5c4bb3e68bc", "author": "Lada Kesseler", "date": "2026-05-28 13:36", "subject": "feat(green): halve damage when target is 5+ levels above attacker", "body": "", "type": "green", "adds": 2, "dels": 1, "files": 1, "diff": "diff --git a/lexler/src/character.ts b/lexler/src/character.ts\nindex 262002d..743ba01 100644\n--- a/lexler/src/character.ts\n+++ b/lexler/src/character.ts\n@@ -9,7 +9,8 @@ export class Character {\n \n   dealDamage(target: Character, amount: number): void {\n     if (target === this) return;\n-    target.receiveDamage(amount);\n+    const adjusted = target.level - this.level >= 5 ? amount / 2 : amount;\n+    target.receiveDamage(adjusted);\n   }\n \n   heal(amount: number): void {\n"}, {"hash": "1a206e9", "full": "1a206e910d208083efda385d97d3bce599dda68d", "author": "Lada Kesseler", "date": "2026-05-28 13:37", "subject": "test(red): damage is increased by 50% when target is 5+ levels below attacker", "body": "", "type": "red", "adds": 9, "dels": 0, "files": 1, "diff": "diff --git a/lexler/tests/character.test.ts b/lexler/tests/character.test.ts\nindex 9316a29..eeda7cf 100644\n--- a/lexler/tests/character.test.ts\n+++ b/lexler/tests/character.test.ts\n@@ -69,4 +69,13 @@ describe('Character', () => {\n \n     expect(target.health).toBe(950);\n   });\n+\n+  it('deals 50% more damage when target is 5+ levels below attacker', () => {\n+    const attacker = new Character({ level: 6 });\n+    const target = new Character();\n+\n+    attacker.dealDamage(target, 100);\n+\n+    expect(target.health).toBe(850);\n+  });\n });\n"}, {"hash": "b0ca905", "full": "b0ca905462f537dbf146688c102516065279c05a", "author": "Lada Kesseler", "date": "2026-05-28 13:37", "subject": "feat(green): increase damage by 50% when target is 5+ levels below attacker", "body": "", "type": "green", "adds": 4, "dels": 1, "files": 1, "diff": "diff --git a/lexler/src/character.ts b/lexler/src/character.ts\nindex 743ba01..87519a0 100644\n--- a/lexler/src/character.ts\n+++ b/lexler/src/character.ts\n@@ -9,7 +9,10 @@ export class Character {\n \n   dealDamage(target: Character, amount: number): void {\n     if (target === this) return;\n-    const adjusted = target.level - this.level >= 5 ? amount / 2 : amount;\n+    const levelDiff = target.level - this.level;\n+    let adjusted = amount;\n+    if (levelDiff >= 5) adjusted = amount / 2;\n+    else if (levelDiff <= -5) adjusted = amount * 1.5;\n     target.receiveDamage(adjusted);\n   }\n \n"}, {"hash": "13c55fe", "full": "13c55fecdd2a12882284c9f2dc92eadcff27ae5e", "author": "Lada Kesseler", "date": "2026-05-28 13:38", "subject": "refactor: extract adjustDamageForLevel to isolate level-difference rule", "body": "", "type": "refactor", "adds": 7, "dels": 4, "files": 1, "diff": "diff --git a/lexler/src/character.ts b/lexler/src/character.ts\nindex 87519a0..a5e0647 100644\n--- a/lexler/src/character.ts\n+++ b/lexler/src/character.ts\n@@ -9,11 +9,14 @@ export class Character {\n \n   dealDamage(target: Character, amount: number): void {\n     if (target === this) return;\n+    target.receiveDamage(this.adjustDamageForLevel(target, amount));\n+  }\n+\n+  private adjustDamageForLevel(target: Character, amount: number): number {\n     const levelDiff = target.level - this.level;\n-    let adjusted = amount;\n-    if (levelDiff >= 5) adjusted = amount / 2;\n-    else if (levelDiff <= -5) adjusted = amount * 1.5;\n-    target.receiveDamage(adjusted);\n+    if (levelDiff >= 5) return amount / 2;\n+    if (levelDiff <= -5) return amount * 1.5;\n+    return amount;\n   }\n \n   heal(amount: number): void {\n"}, {"hash": "5236f06", "full": "5236f061c4741d884fd96e273a19bdd34480a00b", "author": "Lada Kesseler", "date": "2026-05-28 13:38", "subject": "test(red): health cannot exceed 1000 when healing below level 6", "body": "", "type": "red", "adds": 9, "dels": 0, "files": 1, "diff": "diff --git a/lexler/tests/character.test.ts b/lexler/tests/character.test.ts\nindex eeda7cf..05770c6 100644\n--- a/lexler/tests/character.test.ts\n+++ b/lexler/tests/character.test.ts\n@@ -78,4 +78,13 @@ describe('Character', () => {\n \n     expect(target.health).toBe(850);\n   });\n+\n+  it('caps health at 1000 when healing below level 6', () => {\n+    const character = new Character();\n+    new Character().dealDamage(character, 50);\n+\n+    character.heal(200);\n+\n+    expect(character.health).toBe(1000);\n+  });\n });\n"}, {"hash": "cb1bf95", "full": "cb1bf95dae3d88744e86206273eff5005515763e", "author": "Lada Kesseler", "date": "2026-05-28 13:38", "subject": "feat(green): cap health at 1000 when healing", "body": "", "type": "green", "adds": 1, "dels": 1, "files": 1, "diff": "diff --git a/lexler/src/character.ts b/lexler/src/character.ts\nindex a5e0647..30eb3d1 100644\n--- a/lexler/src/character.ts\n+++ b/lexler/src/character.ts\n@@ -21,7 +21,7 @@ export class Character {\n \n   heal(amount: number): void {\n     if (!this.isAlive) return;\n-    this.health += amount;\n+    this.health = Math.min(this.health + amount, 1000);\n   }\n \n   private receiveDamage(amount: number): void {\n"}, {"hash": "da781ab", "full": "da781ab896d02e9b4945786579fe56f39ccca204", "author": "Lada Kesseler", "date": "2026-05-28 13:39", "subject": "test(red): health cap rises to 1500 at level 6+", "body": "", "type": "red", "adds": 8, "dels": 0, "files": 1, "diff": "diff --git a/lexler/tests/character.test.ts b/lexler/tests/character.test.ts\nindex 05770c6..303f22a 100644\n--- a/lexler/tests/character.test.ts\n+++ b/lexler/tests/character.test.ts\n@@ -87,4 +87,12 @@ describe('Character', () => {\n \n     expect(character.health).toBe(1000);\n   });\n+\n+  it('raises the health cap to 1500 at level 6', () => {\n+    const character = new Character({ level: 6 });\n+\n+    character.heal(600);\n+\n+    expect(character.health).toBe(1500);\n+  });\n });\n"}, {"hash": "ee7e1b7", "full": "ee7e1b70b17d68c486c91c0c9f34773397a54c8e", "author": "Lada Kesseler", "date": "2026-05-28 13:39", "subject": "feat(green): characters at level 6+ can heal up to 1500", "body": "", "type": "green", "adds": 2, "dels": 1, "files": 1, "diff": "diff --git a/lexler/src/character.ts b/lexler/src/character.ts\nindex 30eb3d1..6c9e305 100644\n--- a/lexler/src/character.ts\n+++ b/lexler/src/character.ts\n@@ -21,7 +21,8 @@ export class Character {\n \n   heal(amount: number): void {\n     if (!this.isAlive) return;\n-    this.health = Math.min(this.health + amount, 1000);\n+    const cap = this.level >= 6 ? 1500 : 1000;\n+    this.health = Math.min(this.health + amount, cap);\n   }\n \n   private receiveDamage(amount: number): void {\n"}, {"hash": "f51c276", "full": "f51c276d2382f58c906e5e29096c75eaad75ffe3", "author": "Lada Kesseler", "date": "2026-05-28 13:40", "subject": "refactor: extract maxHealth getter as a level-dependent domain concept", "body": "", "type": "refactor", "adds": 5, "dels": 2, "files": 1, "diff": "diff --git a/lexler/src/character.ts b/lexler/src/character.ts\nindex 6c9e305..f59b0da 100644\n--- a/lexler/src/character.ts\n+++ b/lexler/src/character.ts\n@@ -21,8 +21,11 @@ export class Character {\n \n   heal(amount: number): void {\n     if (!this.isAlive) return;\n-    const cap = this.level >= 6 ? 1500 : 1000;\n-    this.health = Math.min(this.health + amount, cap);\n+    this.health = Math.min(this.health + amount, this.maxHealth);\n+  }\n+\n+  get maxHealth(): number {\n+    return this.level >= 6 ? 1500 : 1000;\n   }\n \n   private receiveDamage(amount: number): void {\n"}, {"hash": "e613790", "full": "e6137908909ba39534a4863a7db16b317ad9227a", "author": "Lada Kesseler", "date": "2026-05-28 13:40", "subject": "test(red): a new character belongs to no factions", "body": "", "type": "red", "adds": 6, "dels": 0, "files": 1, "diff": "diff --git a/lexler/tests/character.test.ts b/lexler/tests/character.test.ts\nindex 303f22a..30c697d 100644\n--- a/lexler/tests/character.test.ts\n+++ b/lexler/tests/character.test.ts\n@@ -95,4 +95,10 @@ describe('Character', () => {\n \n     expect(character.health).toBe(1500);\n   });\n+\n+  it('belongs to no factions when newly created', () => {\n+    const character = new Character();\n+\n+    expect(character.factions).toEqual([]);\n+  });\n });\n"}, {"hash": "109ea2d", "full": "109ea2d9b8c5aad9cd785b74e3023936222919e6", "author": "Lada Kesseler", "date": "2026-05-28 13:40", "subject": "feat(green): characters have an empty factions list by default", "body": "", "type": "green", "adds": 1, "dels": 0, "files": 1, "diff": "diff --git a/lexler/src/character.ts b/lexler/src/character.ts\nindex f59b0da..a0dd3c7 100644\n--- a/lexler/src/character.ts\n+++ b/lexler/src/character.ts\n@@ -2,6 +2,7 @@ export class Character {\n   health = 1000;\n   isAlive = true;\n   level: number;\n+  readonly factions: string[] = [];\n \n   constructor(options: { level?: number } = {}) {\n     this.level = options.level ?? 1;\n"}, {"hash": "4a4a7b9", "full": "4a4a7b94a906fb8724a4bc40a71f76a67f6eb7b8", "author": "Lada Kesseler", "date": "2026-05-28 13:41", "subject": "test(red): a character can join a faction", "body": "", "type": "red", "adds": 8, "dels": 0, "files": 1, "diff": "diff --git a/lexler/tests/character.test.ts b/lexler/tests/character.test.ts\nindex 30c697d..7454383 100644\n--- a/lexler/tests/character.test.ts\n+++ b/lexler/tests/character.test.ts\n@@ -101,4 +101,12 @@ describe('Character', () => {\n \n     expect(character.factions).toEqual([]);\n   });\n+\n+  it('can join a faction', () => {\n+    const character = new Character();\n+\n+    character.join('Knights');\n+\n+    expect(character.factions).toContain('Knights');\n+  });\n });\n"}, {"hash": "ae22f15", "full": "ae22f1504c3bdab5141fb93802c795f71ad62be0", "author": "Lada Kesseler", "date": "2026-05-28 13:41", "subject": "feat(green): characters can join factions", "body": "", "type": "green", "adds": 4, "dels": 0, "files": 1, "diff": "diff --git a/lexler/src/character.ts b/lexler/src/character.ts\nindex a0dd3c7..1adc7c3 100644\n--- a/lexler/src/character.ts\n+++ b/lexler/src/character.ts\n@@ -29,6 +29,10 @@ export class Character {\n     return this.level >= 6 ? 1500 : 1000;\n   }\n \n+  join(faction: string): void {\n+    this.factions.push(faction);\n+  }\n+\n   private receiveDamage(amount: number): void {\n     this.health -= amount;\n     if (this.health <= 0) {\n"}, {"hash": "2ba6264", "full": "2ba62640dd27964b226989982f6c335e9999803b", "author": "Lada Kesseler", "date": "2026-05-28 13:42", "subject": "test(red): a character can leave a faction", "body": "", "type": "red", "adds": 10, "dels": 0, "files": 1, "diff": "diff --git a/lexler/tests/character.test.ts b/lexler/tests/character.test.ts\nindex 7454383..36dfef6 100644\n--- a/lexler/tests/character.test.ts\n+++ b/lexler/tests/character.test.ts\n@@ -109,4 +109,14 @@ describe('Character', () => {\n \n     expect(character.factions). \n     expect(character.level).toBe(2);\n   });\n \n+  it('gains a level after joining 3 distinct factions', () => {\n+    const character = new Character();\n+\n+    character.join('Knights');\n+    character.join('Mages');\n+    character.join('Rangers');\n+\n+    expect(character.level).toBe(2);\n+  });\n+\n   it('needs an additional 2000 survived damage to go from level 2 to level 3', () => {\n     const character = new Character({ level: 2 });\n     const attacker = new Character();\n"}, {"hash": "73fbbe8", "full": "73fbbe8bde2b153090c238dae7884f99acab1ebc", "author": "Lada Kesseler", "date": "2026-05-28 13:57", "subject": "feat(green): characters gain a level after joining 3 distinct factions", "body": "", "type": "green", "adds": 11, "dels": 0, "files": 1, "diff": "diff --git a/lexler/src/character.ts b/lexler/src/character.ts\nindex c35ba5d..1d569b3 100644\n--- a/lexler/src/character.ts\n+++ b/lexler/src/character.ts\n@@ -53,7 +53,18 @@ export class Character {\n     return this.level >= 6 ? 1500 : 1000;\n   }\n \n+  private readonly factionsEverJoined = new Set<string>();\n+  private factionsTowardNextLevel = 0;\n+\n   join(faction: string): void {\n+    if (!this.factionsEverJoined.has(faction)) {\n+      this.factionsEverJoined.add(faction);\n+      this.factionsTowardNextLevel += 1;\n+      if (this.factionsTowardNextLevel >= 3) {\n+        this.factionsTowardNextLevel -= 3;\n+        this.level += 1;\n+      }\n+    }\n     this._factions.add(faction);\n   }\n \n"}, {"hash": "412a0ce", "full": "412a0cebcc409b3d2e12c2d51879127fd810d28c", "author": "Lada Kesseler", "date": "2026-05-28 13:57", "subject": "refactor: extract progressLevelFromFactions; clarify join's responsibilities", "body": "", "type": "refactor", "adds": 11, "dels": 8, "files": 1, "diff": "diff --git a/lexler/src/character.ts b/lexler/src/character.ts\nindex 1d569b3..9a94722 100644\n--- a/lexler/src/character.ts\n+++ b/lexler/src/character.ts\n@@ -57,15 +57,18 @@ export class Character {\ test.ts\nindex 6120ccf..491ba57 100644\n--- a/lexler/tests/character.test.ts\n+++ b/lexler/tests/character.test.ts\n@@ -207,6 +207,14 @@ describe('Character', () => {\n     expect(character.level).toBe(10);\n   });\n \n+  it('cannot go beyond level 10 via faction progression', () => {\n+    const character = new Character({ level: 10 });\n+\n+    for (let i = 0; i < 100; i += 1) character.join(`Faction${i}`);\n+\n+    expect(character.level).toBe(10);\n+  });\n+\n   it('needs an additional 2000 survived damage to go from level 2 to level 3', () => {\n     const character = new Character({ level: 2 });\n     const attacker = new Character();\n"}, {"hash": "8b7cd48", "full": "8b7cd487f4703d6c552f2c71a1c2561b3b095fdf", "author": "Lada Kesseler", "date": "2026-05-28 13:59", "subject": "feat(green): faction-driven progression also caps at level 10", "body": "", "type": "green", "adds": 1, "dels": 0, "files": 1, "diff": "diff --git a/lexler/src/character.ts b/lexler/src/character.ts\nindex 627bddd..42ab242 100644\n--- a/lexler/src/character.ts\n+++ b/lexler/src/character.ts\n@@ -64,6 +64,7 @@ export class Character {\n   }\n \n   private progressLevelFromFactions(): void {\n+    if (this.level >= 10) return;\n     this.factionsTowardNextLevel += 1;\n     if (this.factionsTowardNextLevel >= 3) {\n       this.factionsTowardNextLevel -= 3;\n"}, {"hash": "66bc23d", "full": "66bc23d438b823becac0db34f05ffccbeb7b788d", "author": "Lada Kesseler", "date": "2026-05-28 14:00", "subject": "refactor: extract MAX_LEVEL constant and regroup fields/methods in Character", "body": "", "type": "refactor", "adds": 35, "dels": 34, "files": 1, "diff": "diff --git a/lexler/src/character.ts b/lexler/src/character.ts\nindex 42ab242..a0c3a94 100644\n--- a/lexler/src/character.ts\n+++ b/lexler/src/character.ts\n@@ -1,17 +1,27 @@\n import type { MagicalWeapon } from './magical-object.js';\n \n+const MAX_LEVEL = 10;\n+\n export class Character {\n   health = 1000;\n   isAlive = true;\n   level: number;\n+\n   private readonly _factions = new Set<string>();\n+  private readonly factionsEverJoined = new Set<string>();\n+  private factionsTowardNextLevel = 0;\n+  private damageSurvived = 0;\n+\n+  constructor(options: { level?: number } = {}) {\n+    this.level = options.level ?? 1;\n+  }\n \n   get factions(): string[] {\n     return [...this._factions];\n   }\n \n-  constructor(options: { level?: number } = {}) {\n-    this.level = options.level ?? 1;\n+  get maxHealth(): number {\n+    return this.level >= 6 ? 1500 : 1000;\n   }\n \n   attackWith(weapon: MagicalWeapon, target: Character): void {\n@@ -25,20 +35,6 @@ export class Character {\n     target.receiveDamage(this.adjustDamageForLevel(target, amount));\n   }\n \n-  private isAllyOf(other: Character): boolean {\n-    for (const faction of this._factions) {\n-      if (other._factions.has(faction)) return true;\n-    }\n-    return false;\n-  }\n-\n-  private adjustDamageForLevel(target: Character, amount: number): number {\n-    const levelDiff = target.level - this.level;\n-    if (levelDiff >= 5) return amount / 2;\n-    if (levelDiff <= -5) return amount * 1.5;\n-    return amount;\n-  }\n-\n   heal(target: Character, amount: number): void {\n     if (target !== this && !this.isAllyOf(target)) return;\n     target.gainHealth(amount);\n@@ -49,13 +45,6 @@ export class Character {\n     this.health = Math.min(this.health + amount, this.maxHealth);\n   }\n \n-  get maxHealth(): number {\n-    return this.level >= 6 ? 1500 : 1000;\n-  }\n-\n-  private readonly factionsEverJoined = new Set<string>();\n-  private factionsTowardNextLevel = 0;\n-\n   join(faction: string): void {\n     const isNewToCharacter = !this.factionsEverJoined.has(faction);\n     this._factions.add(faction);\n@@ -63,20 +52,23 @@ export class Character {\n     if (isNewToCharacter) this.progressLevelFromFactions();\n   }\n \n-  private progressLevelFromFactions(): void {\n-    if (this.level >= 10) return;\n-    this.factionsTowardNextLevel += 1;\n-    if (this.factionsTowardNextLevel >= 3) {\n-      this.factionsTowardNextLevel -= 3;\n-      this.level += 1;\n-    }\n-  }\n-\n   leave(faction: string): void {\n     this._factions.delete(faction);\n   }\n \n-  private damageSurvived = 0;\n+  private isAllyOf(other: Character): boolean {\n+    for (const faction of this._factions) {\n+      if (other._factions.has(faction)) return true;\n+    }\n+    return false;\n+  }\n+\n+  private adjustDamageForLevel(target: Character, amount: number): number {\n+    const levelDiff = target.level - this.level;\n+    if (levelDiff >= 5) return amount / 2;\n+    if (levelDiff <= -5) return amount * 1.5;\n+    return amount;\n+  }\n \n   private receiveDamage(amount: number): void {\n     this.health -= amount;\n@@ -89,7 +81,7 @@ export class Character {\n   }\n \n   private progressLevelFromDamage(amount: number): void {\n-    if (this.level >= 10) return;\n+    if (this.level >= MAX_LEVEL) return;\n     this.damageSurvived += amount;\n     const threshold = this.level * 1000;\n     if (this.damageSurvived >= threshold) {\n@@ -97,4 +89,13 @@ export class Character {\n       this.level += 1;\n     }\n   }\n+\n+  private progressLevelFromFactions(): void {\n+    if (this.level >= MAX_LEVEL) return;\n+    this.factionsTowardNextLevel += 1;\n+    if (this.factionsTowardNextLevel >= 3) {\n+      this.factionsTowardNextLevel -= 3;\n+      this.level += 1;\n+    }\n+  }\n }\n"}, {"hash": "96233a4", "full": "96233a4e9cfef078ff7b6f1b7ca21e6b0c618831", "author": "Lada Kesseler", "date": "2026-05-28 14:01", "subject": "test: HealingObject does not push a character above maxHealth (passed without red)", "body": "", "type": "red", "adds": 10, "dels": 0, "files": 1, "diff": "diff --git a/lexler/tests/magical-object.test.ts b/lexler/tests/magical-object.test.ts\nindex 858e99b..54dd7c7 100644\n--- a/lexler/tests/magical-object.test.ts\n+++ b/lexler/tests/magical-object.test.ts\n@@ -33,6 +33,16 @@ describe('HealingObject', () => {\n     expect(character.health).toBe(800);\n   });\n \n+  it('cannot push a character above their max health', () => {\n+    const character = new Character();\n+    new Character().dealDamage(character, 100);\n+    const fountain = new HealingObject({ maxHealth: 500 });\n+\n+    fountain.heal(character, 500);\n+\n+    expect(character.health).toBe(1000);\n+  });\n+\n   it('cannot give more health than it has remaining', () => {\n     const character = new Character();\n     new Character().dealDamage(character, 400);\n"}, {"hash": "b2125e9", "full": "b2125e93d66f383d56930e0efa3924ae03588752", "author": "Lada Kesseler", "date": "2026-05-28 14:01", "subject": "test: re-joining a current faction does not double-count toward level (passed without red)", "body": "", "type": "red", "adds": 10, "dels": 0, "files": 1, "diff": "diff --git a/lexler/tests/character.test.ts b/lexler/tests/character.test.ts\nindex 491ba57..d6fab29 100644\n--- a/lexler/tests/character.test.ts\n+++ b/lexler/tests/character.test.ts\n@@ -207,6 +207,16 @@ describe('Character', () => {\n     expect(character.level).toBe(10);\n   });\n \n+  it('does not double-count when joining a faction it already belongs to', () => {\n+    const character = new Character();\n+\n+    character.join('Knights');\n+    character.join('Knights');\n+    character.join('Mages');\n+\n+    expect(character.level).toBe(1);\n+  });\n+\n   it('cannot go beyond level 10 via faction progression', () => {\n     const character = new Character({ level: 10 });\n \n"}, {"hash": "1f29dee", "full": "1f29dee529ffed315c14b0e34443d9f4cd6f3655", "author": "Lada Kesseler", "date": "2026-05-28 14:02", "subject": "test: damage is not adjusted when level gap is below 5 (passed without red)", "body": "", "type": "red", "adds": 9, "dels": 0, "files": 1, "diff": "diff --git a/lexler/tests/character.test.ts b/lexler/tests/character.test.ts\nindex d6fab29..c106166 100644\n--- a/lexler/tests/character.test.ts\n+++ b/lexler/tests/character.test.ts\n@@ -70,6 +70,15 @@ describe('Character', () => {\n     expect(target.health).toBe(950);\n   });\n \n+  it('deals normal damage when the level gap is less than 5', () => {\n+    const attacker = new Character();\n+    const target = new Character({ level: 5 });\n+\n+    attacker.dealDamage(target, 100);\n+\n+    expect(target.health).toBe(900);\n+  });\n+\n   it('deals 50% more damage when target is 5+ levels below attacker', () => {\n     const attacker = new Character({ level: 6 });\n     const target = new Character();\n"}]}, "devill": {"label": "devill", "tagline": "habit hooks", "commits": [{"hash": "e159651", "full": "e159651c577eb7b758047c39d4fc4677249e34a9", "author": "Claude Code", "date": "2026-05-28 13:30", "subject": "chore: initial project scaffold", "body": "TypeScript + vitest (file-snapshot approval testing) + habit-hooks\n(linked from ../habit-hooks). Adds CLAUDE.md instructing agents to\nrun `pnpm run ci` and commit after every task.\n\nCo-Authored-By: Claude Opus 4.7 <noreply@anthropic.com>", "type": "chore", "adds": 10, "dels": 0, "files": 3, "diff": "diff --git a/devill/src/index.ts b/devill/src/index.ts\nnew file mode 100644\nindex 0000000..24137d7\n--- /dev/null\n+++ b/devill/src/index.ts\n@@ -0,0 +1 @@\n+export const greet = (name: string): string => `Hello, ${name}!`;\ndiff --git a/devill/tests/__snapshots__/greet-by-name.txt b/devill/tests/__snapshots__/greet-by-name.txt\nnew file mode 100644\nindex 0000000..b45ef6f\n--- /dev/null\n+++ b/devill/tests/__snapshots__/greet-by-name.txt\n@@ -0,0 +1 @@\n+Hello, World!\n\\ No newline at end of file\ndiff --git a/devill/tests/greet.test.ts b/devill/tests/greet.test.ts\nnew file mode 100644\nindex 0000000..749bba8\n--- /dev/null\n+++ b/devill/tests/greet.test.ts\n@@ -0,0 +1,8 @@\n+import { describe, expect, it } from 'vitest';\n+import { greet } from '../src/index.js';\n+\n+describe('greet', () => {\n+  it('greets by name', async () => {\n+    await expect(greet('World')).toMatchFileSnapshot('./__snapshots__/greet-by-name.txt');\n+  });\n+});\n"}, {"hash": "586b830", "full": "586b830b706881e7c6fd8d198297dc028403119b", "author": "Claude Code", "date": "2026-05-28 14:12", "subject": "feat: phase 1 — character health, damage, healing", "body": "Adds Character class with the Phase 1 spec rules: starts at 1000/alive,\ntakes damage (floored at 0), dies at 0 HP, heals up to 1000, dead cannot heal.\nTests are data-driven via Vitest it.each — one row per scenario.\n\nCo-Authored-By: Claude Opus 4.7 <noreply@anthropic.com>", "type": "green", "adds": 46, "dels": 0, "files": 2, "diff": "diff --git a/devill/src/character.ts b/devill/src/character.ts\nnew file mode 100644\nindex 0000000..5d6ce62\n--- /dev/null\n+++ b/devill/src/character.ts\n@@ -0,0 +1,16 @@\n+const MAX_HEALTH = 1000;\n+\n+export class Character {\n+  health = MAX_HEALTH;\n+  alive = true;\n+\n+  attack(target: Character, amount: number): void {\n+    target.health = Math.max(0, target.health - amount);\n+    if (target.health === 0) target.alive = false;\n+  }\n+\n+  heal(amount: number): void {\n+    if (!this.alive) return;\n+    this.health = Math.min(MAX_HEALTH, this.health + amount);\n+  }\n+}\ndiff --git a/devill/tests/character.test.ts b/devill/tests/character.test.ts\nnew file mode 100644\nindex 0000000..47c0a28\n--- /dev/null\n+++ b/devill/tests/character.test.ts\n@@ -0,0 +1,30 @@\n+import { describe, expect, it } from 'vitest';\n+import { Character } from '../src/character.js';\n+\n+interface Scenario {\n+  name: string;\n+  preDamage: number;\n+  heal: number;\n+  expected: { health: number; alive: boolean };\n+}\n+\n+const scenarios: Scenario[] = [\n+  { name: 'starts at full health and alive',            preDamage: 0,    heal: 0,   expected: { health: 1000, alive: true  } },\n+  { name: 'takes damage from an attacker',              preDamage: 200,  heal: 0,   expected: { health: 800,  alive: true  } },\n+  { name: 'dies when health reduced to exactly zero',   preDamage: 1000, heal: 0,   expected: { health: 0,    alive: false } },\n+  { name: 'overkill damage leaves health at 0, not negative', preDamage: 5000, heal: 0,   expected: { health: 0,    alive: false } },\n+  { name: 'healing a living character restores health', preDamage: 400,  heal: 200, expected: { health: 800,  alive: true  } },\n+  { name: 'healing cannot exceed max health of 1000',   preDamage: 50,   heal: 200, expected: { health: 1000, alive: true  } },\n+  { name: 'a dead character cannot be healed back',     preDamage: 5000, heal: 500, expected: { health: 0,    alive: false } },\n+];\n+\n+describe('Character', () => {\n+  it.each(scenarios)('$name', ({ preDamage, heal, expected }) => {\n+    const alice = new Character();\n+    const bob = new Character();\n+    if (preDamage > 0) bob.attack(alice, preDamage);\n+    if (heal > 0) alice.heal(heal);\n+    expect(alice.health).toBe(expected.health);\n+    expect(alice.alive).toBe(expected.alive);\n+  });\n+});\n"}, {"hash": "c7a9945", "full": "c7a99456b8ae37def5b7b02d8460053d5104ab6c", "author": "Claude Code", "date": "2026-05-28 14:16", "subject": "feat: phase 2 — characters cannot damage themselves", "body": "Adds a self-targeting guard in Character.attack so alice.attack(alice, N)\nis a silent no-op for any N, alive or dead.\n\nCo-Authored-By: Claude Opus 4.7 <noreply@anthropic.com>", "type": "green", "adds": 27, "dels": 0, "files": 2, "diff": "diff --git a/devill/src/character.ts b/devill/src/character.ts\nindex 5d6ce62..3af3f10 100644\n--- a/devill/src/character.ts\n+++ b/devill/src/character.ts\n@@ -5,6 +5,7 @@ export class Character {\n   alive = true;\n \n   attack(target: Character, amount: number): void {\n+    if (target === this) return;\n     target.health = Math.max(0, target.health - amount);\n     if (target.health === 0) target.alive = false;\n   }\ndiff --git a/devill/tests/self-targeting.test.ts b/devill/tests/self-targeting.test.ts\nnew file mode 100644\nindex 0000000..dae4c2a\n--- /dev/null\n+++ b/devill/tests/self-targeting.test.ts\n@@ -0,0 +1,26 @@\n+import { describe, expect, it } from 'vitest';\n+import { Character } from '../src/character.js';\n+\n+interface Scenario {\n+  name: string;\n+  preDamage: number;\n+  selfAttack: number;\n+  expected: { health: number; alive: boolean };\n+}\n+\n+const scenarios: Scenario[] = [\n+  { name: 'living character attacking self does nothing', preDamage: 0,    selfAttack: 200,  expected: { health: 1000, alive: true  } },\n+  { name: 'large self-attack is also a no-op',            preDamage: 0,    selfAttack: 5000, expected: { health: 1000, alive: true  } },\n+  { name: 'dead character self-attack remains a no-op',   preDamage: 5000, selfAttack: 200,  expected: { health: 0,    alive: false } },\n+];\n+\n+describe('self-targeting', () => {\n+  it.each(scenarios)('$name', ({ preDamage, selfAttack, expected }) => {\n+    const alice = new Character();\n+    const bob = new Character();\n+    if (preDamage > 0) bob.attack(alice, preDamage);\n+    if (selfAttack > 0) alice.attack(alice, selfAttack);\n+    expect(alice.health).toBe(expected.health);\n+    expect(alice.alive).toBe(expected.alive);\n+  });\n+});\n"}, {"hash": "be9acc7", "full": "be9acc70c5bf3ba44a18e8de07ab504e3b0ab67b", "author": "Claude Code", "date": "2026-05-28 14:21", "subject": "feat: phase 3 — levels, max health, and damage modifiers", "body": "Adds Character.level (default 1, set via constructor). Max health is dynamic\nvia a getter: 1000 below level 6, 1500 at level 6+. Damage modifier in attack:\n+50% when the attacker is 5+ levels above the target, -50% when 5+ levels below.\n\nCo-Authored-By: Claude Opus 4.7 <noreply@anthropic.com>", "type": "green", "adds": 77, "dels": 5, "files": 2, "diff": "diff --git a/devill/src/character.ts b/devill/src/character.ts\nindex 3af3f10..6b10484 100644\n--- a/devill/src/character.ts\n+++ b/devill/src/character.ts\n@@ -1,17 +1,33 @@\n-const MAX_HEALTH = 1000;\n-\n export class Character {\n-  health = MAX_HEALTH;\n+  level: number;\n+  health: number;\n   alive = true;\n \n+  constructor(level = 1) {\n+    this.level = level;\n+    this.health = this.maxHealth;\n+  }\n+\n+  get maxHealth(): number {\n+    return this.level >= 6 ? 1500 : 1000;\n+  }\n+\n   attack(target: Character, amount: number): void {\n     if (target === this) return;\n-    target.health = Math.max(0, target.health - amount);\n+    const dealt = this.applyLevelModifier(target, amount);\n+    target.health = Math.max(0, target.health - dealt);\n     if (target.health === 0) target.alive = false;\n   }\n \n   heal(amount: number): void {\n     if (!this.alive) return;\n-    this.health = Math.min(MAX_HEALTH, this.health + amount);\n+    this.health = Math.min(this.maxHealth, this.health + amount);\n+  }\n+\n+  private applyLevelModifier(target: Character, amount: number): number {\n+    const gap = this.level - target.level;\n+    if (gap >= 5) return amount * 1.5;\n+    if (gap <= -5) return amount * 0.5;\n+    return amount;\n   }\n }\ndiff --git a/devill/tests/levels.test.ts b/devill/tests/levels.test.ts\nnew file mode 100644\nindex 0000000..06b2ac8\n--- /dev/null\n+++ b/devill/tests/levels.test.ts\n@@ -0,0 +1,56 @@\n+import { describe, expect, it } from 'vitest';\n+import { Character } from '../src/character.js';\n+\n+interface DamageScenario {\n+  name: string;\n+  attackerLevel: number;\n+  targetLevel: number;\n+  damage: number;\n+  expectedDamageDealt: number;\n+}\n+\n+const damageScenarios: DamageScenario[] = [\n+  { name: 'same level: damage unchanged',             attackerLevel: 1,  targetLevel: 1,  damage: 100, expectedDamageDealt: 100 },\n+  { name: 'attacker 4 levels above: unchanged',       attackerLevel: 5,  targetLevel: 1,  damage: 100, expectedDamageDealt: 100 },\n+  { name: 'attacker exactly 5 levels above: +50%',    attackerLevel: 6,  targetLevel: 1,  damage: 100, expectedDamageDealt: 150 },\n+  { name: 'attacker 9 levels above: +50%',            attackerLevel: 10, targetLevel: 1,  damage: 100, expectedDamageDealt: 150 },\n+  { name: 'target 4 levels above: unchanged',         attackerLevel: 1,  targetLevel: 5,  damage: 100, expectedDamageDealt: 100 },\n+  { name: 'target exactly 5 levels above: -50%',      attackerLevel: 1,  targetLevel: 6,  damage: 100, expectedDamageDealt: 50  },\n+  { name: 'target 9 levels above: -50%',              attackerLevel: 1,  targetLevel: 10, damage: 100, expectedDamageDealt: 50  },\n+];\n+\n+describe('level damage modifier', () => {\n+  it.each(damageScenarios)('$name', ({ attackerLevel, targetLevel, damage, expectedDamageDealt }) => {\n+    const attacker = new Character(attackerLevel);\n+    const target = new Character(targetLevel);\n+    const startingHealth = target.health;\n+    attacker.attack(target, damage);\n+    expect(startingHealth - target.health).toBe(expectedDamageDealt);\n+  });\n+});\n+\n+interface MaxHealthScenario {\n+  name: string;\n+  level: number;\n+  preDamage: number;\n+  heal: number;\n+  expectedHealth: number;\n+}\n+\n+const maxHealthScenarios: MaxHealthScenario[] = [\n+  { name: 'level 1 starts at 1000',         level: 1,  preDamage: 0,   heal: 0,    expectedHealth: 1000 },\n+  { name: 'level 5 still starts at 1000',   level: 5,  preDamage: 0,   heal: 0,    expectedHealth: 1000 },\n+  { name: 'level 6 starts at 1500',         level: 6,  preDamage: 0,   heal: 0,    expectedHealth: 1500 },\n+  { name: 'level 10 starts at 1500',        level: 10, preDamage: 0,   heal: 0,    expectedHealth: 1500 },\n+  { name: 'level 6 heal caps at 1500',      level: 6,  preDamage: 100, heal: 5000, expectedHealth: 1500 },\n+];\n+\n+describe('max health by level', () => {\n+  it.each(maxHealthScenarios)('$name', ({ level, preDamage, heal, expectedHealth }) => {\n+    const subject = new Character(level);\n+    const bob = new Character();\n+    if (preDamage > 0) bob.attack(subject, preDamage);\n+    if (heal > 0) subject.heal(heal);\n+    expect(subject.health).toBe(expectedHealth);\n+  });\n+});\n"}, {"hash": "427ffa4", "full": "427ffa4f11c54dada260ce670c6ec178f34a2d66", "author": "Claude Code", "date": "2026-05-28 14:27", "subject": "feat: phase 4 — factions, ally rules, and heal-target signature", "body": "Adds Character.factions and join(faction). Allies (share ≥1 faction)\ncannot damage each other. heal now takes a target: self-heal always\npermitted, ally-heal permitted, otherwise no-op. Phase 1/3 heal call\nsites updated to the new heal(target, amount) signature.\n\nCo-Authored-By: Claude Opus 4.7 <noreply@anthropic.com>", "type": "green", "adds": 76, "dels": 5, "files": 4, "diff": "diff --git a/devill/src/character.ts b/devill/src/character.ts\nindex 6b10484..bfd9d02 100644\n--- a/devill/src/character.ts\n+++ b/devill/src/character.ts\n@@ -2,6 +2,7 @@ export class Character {\n   level: number;\n   health: number;\n   alive = true;\n+  factions = new Set<string>();\n \n   constructor(level = 1) {\n     this.level = level;\n@@ -12,16 +13,29 @@ export class Character {\n     return this.level >= 6 ? 1500 : 1000;\n   }\n \n+  join(faction: string): void {\n+    this.factions.add(faction);\n+  }\n+\n   attack(target: Character, amount: number): void {\n     if (target === this) return;\n+    if (this.sharesFactionWith(target)) return;\n     const dealt = this.applyLevelModifier(target, amount);\n     target.health = Math.max(0, target.health - dealt);\n     if (target.health === 0) target.alive = false;\n   }\n \n-  heal(amount: number): void {\n-    if (!this.alive) return;\n-    this.health = Math.min(this.maxHealth, this.health + amount);\n+  heal(target: Character, amount: number): void {\n+    if (!target.alive) return;\n+    if (target !== this && !this.sharesFactionWith(target)) return;\n+    target.health = Math.min(target.maxHealth, target.health + amount);\n+  }\n+\n+  private sharesFactionWith(other: Character): boolean {\n+    for (const faction of this.factions) {\n+      if (other.factions.has(faction)) return true;\n+    }\n+    return false;\n   }\n \n   private apply scribe('faction attack rules', () => {\n+  it.each(attackScenarios)('$name', ({ aliceFactions, bobFactions, damage, expectedAliceHealth }) => {\n+    const alice = new Character();\n+    const bob = new Character();\n+    for (const f of aliceFactions) alice.join(f);\n+    for (const f of bobFactions) bob.join(f);\n+    bob.attack(alice, damage);\n+    expect(alice.health).toBe(expectedAliceHealth);\n+  });\n+});\n+\n+interface HealScenario {\n+  name: string;\n+  aliceFactions: string[];\n+  bobFactions: string[];\n+  preDamage: number;\n+  bobHealsAliceBy: number;\n+  expectedAliceHealth: number;\n+}\n+\n+const healScenarios: HealScenario[] = [\n+  { name: 'shared faction: bob heals alice',                aliceFactions: ['Red'], bobFactions: ['Red'],  preDamage: 400, bobHealsAliceBy: 200, expectedAliceHealth: 800 },\n+  { name: 'no shared faction: bob cannot heal alice',       aliceFactions: ['Red'], bobFactions: ['Blue'], preDamage: 400, bobHealsAliceBy: 200, expectedAliceHealth: 600 },\n+  { name: 'both unaffiliated: bob cannot heal alice',       aliceFactions: [],      bobFactions: [],       preDamage: 400, bobHealsAliceBy: 200, expectedAliceHealth: 600 },\n+];\n+\n+describe('faction heal rules', () => {\n+  it.each(healScenarios)('$name', ({ aliceFactions, bobFactions, preDamage, bobHealsAliceBy, expectedAliceHealth }) => {\n+    const alice = new Character();\n+    const bob = new Character();\n+    const stranger = new Character();\n+    for (const f of aliceFactions) alice.join(f);\n+    for (const f of bobFactions) bob.join(f);\n+    stranger.attack(alice, preDamage);\n+    bob.heal(alice, bobHealsAliceBy);\n+    expect(alice.health).toBe(expectedAliceHealth);\n+  });\n+});\ndiff --git a/devill/tests/levels.test.ts b/devill/tests/levels.test.ts\nindex 06b2ac8..cfd82f2 100644\n--- a/devill/tests/levels.test.ts\n+++ b/devill/tests/levels.test.ts\n@@ -50,7 +50,7 @@ describe('max health by level', () => {\n     const subject = new Character(level);\n     const bob = new Character();\n     if (preDamage > 0) bob.attack(subject, preDamage);\n-    if (heal > 0) subject.heal(heal);\n+    if (heal > 0) subject.heal(subject, heal);\n     expect(subject.health).toBe(expectedHealth);\n   });\n });\n"}, {"hash": "1e38ea3", "full": "1e38ea3489f13482c811efd9eedbf8e5c05201ca", "author": "Claude Code", "date": "2026-05-28 14:36", "subject": "feat: phase 5 — magical objects, healing objects, and weapons", "body": "Adds Damageable interface, MagicalObject (with HealingObject and\nMagicalWeapon subtypes), and two new Character methods: attackWith\nconsumes a weapon for fixed-damage attacks; healWith uses a healing\nobject capped by both the object's stored health and the target's max.\nCharacter.attack widens to accept any Damageable; level modifier\napplies only to Character targets. Extracts canDamage / applyDamage /\nconsumeWeapon helpers to keep attack and attackWith DRY.\n\nCo-Authored-By: Claude Opus 4.7 <noreply@anthropic.com>", "type": "green", "adds": 163, "dels": 7, "files": 4, "diff": "diff --git a/devill/src/character.ts b/devill/src/character.ts\nindex bfd9d02..de94117 100644\n--- a/devill/src/character.ts\n+++ b/devill/src/character.ts\n@@ -1,4 +1,7 @@\n-export class Character {\n+import type { Damageable } from './damageable.js';\n+import { HealingObject, MagicalWeapon } from './magical-object.js';\n+\n+export class Character implements Damageable {\n   level: number;\n   health: number;\n   alive = true;\n@@ -17,12 +20,17 @@ export class Character {\n     this.factions.add(faction);\n   }\n \n-  attack(target: Character, amount: number): void {\n-    if (target === this) return;\n-    if (this.sharesFactionWith(target)) return;\n-    const dealt = this.applyLevelModifier(target, amount);\n-    target.health = Math.max(0, target.health - dealt);\n-    if (target.health === 0) target.alive = false;\n+  attack(target: Damageable, amount: number): void {\n+    if (!this.canDamage(target)) return;\n+    const dealt = target instanceof Character ? this.applyLevelModifier(target, amount) : amount;\n+    this.applyDamage(target, dealt);\n+  }\n+\n+  attackWith(target: Damageable, weapon: MagicalWeapon): void {\n+    if (!weapon.alive) return;\n+    if (!this.canDamage(target)) return;\n+    this.applyDamage(target, weapon.damage);\n+    this.consumeWeapon(weapon);\n   }\n \n   heal(target: Character, amount: number): void {\n@@ -31,6 +39,30 @@ export class Character {\n     target.health = Math.min(target.maxHealth, target.health + amount);\n   }\n \n+  healWith(target: Character, object: HealingObject): void {\n+    if (!target.alive || !object.alive) return;\n+    const amount = Math.min(object.health, target.maxHealth - target.health);\n+    target.health += amount;\n+    object.health -= amount;\n+    if (object.health === 0) object.alive = false;\n+  }\n+\n+  private canDamage(target: Damageable): boolean {\n+    if (target === this) return false;\n+    if (target instanceof Character && this.sharesFactionWith(target)) return false;\n+    return true;\n+  }\n+\n+  private applyDamage(target: Damageable, amount: number): void {\n+    target.health = Math.max(0, target.health - amount);\n+    if (target.health === 0) target.alive = false;\n+  }\n+\n+  private consumeWeapon(weapon: MagicalWeapon): void {\n+    weapon.health -= 1;\n+    if (weapon.health === 0) weapon.alive = false;\n+  }\n+\n   private sharesFactionWith(other: Character): boolean {\n     for (const faction of this.factions) {\n       if (other.factions.has(faction)) return true;\ndiff --git a/devill/src/damageable.ts b/devill/src/damageable.ts\nnew file mode 100644\nindex 0000000..65b563f\n--- /dev/null\n+++ b/devill/src/damageable.ts\n@@ -0,0 +1,4 @@\n+export interface Damageable {\n+  health: number;\n+  alive: boolean;\n+}\ndiff --git a/devill/src/magical-object.ts b/devill/src/magical-object.ts\nnew file mode 100644\nindex 0000000..482f3d6\n--- /dev/null\n+++ b/devill/src/magical-object.ts\n@@ -0,0 +1,21 @@\n+import type { Damageable } from './damageable.js';\n+\n+export class MagicalObject implements Damageable {\n+  health: number;\n+  alive = true;\n+\n+  constructor(public readonly maxHealth: number) {\n+    this.health = maxHealth;\n+  }\n+}\n+\n+export class HealingObject extends MagicalObject {}\n+\n+export class MagicalWeapon extends MagicalObject {\n+  readonly damage: number;\n+\n+  constructor(maxHealth: number, damage: number) {\n+    super(maxHealth);\n+    this.damage = damage;\n+  }\n+}\ndiff --git a/devill/tests/magical-objects.test.ts b/devill/tests/magical-objects.test.ts\nnew file mode 100644\nindex 0000000..85b9e6a\n--- /dev/null\n+++ b/devill/tests/magical-objects.test.ts\n@@ -0,0 +1,99 @@\n+import { describe, expect, it } from 'vitest';\n+import { Character } from '../src/character.js';\n+import { HealingObject, MagicalObject, MagicalWeapon } from '../src/magical-object.js';\n+\n+interface ObjectDamageScenario {\n+  name: string;\n+  objectMax: number;\n+  damage: number;\n+  expectedObjectHealth: number;\n+  expectedObjectAlive: boolean;\n+}\n+\n+const objectDamageScenarios: ObjectDamageScenario[] = [\n+  { name: 'object takes partial damage',         objectMax: 500, damage: 100,  expectedObjectHealth: 400, expectedObjectAlive: true  },\n+  { name: 'object destroyed at exactly zero',    objectMax: 500, damage: 500,  expectedObjectHealth: 0,   expectedObjectAlive: false },\n+  { name: 'overkill damage clamps to zero',      objectMax: 500, damage: 5000, expectedObjectHealth: 0,   expectedObjectAlive: false },\n+];\n+\n+describe('magical object damage', () => {\n+  it.each(objectDamageScenarios)('$name', ({ objectMax, damage, expectedObjectHealth, expectedObjectAlive }) => {\n+    const alice = new Character();\n+    const object = new MagicalObject(objectMax);\n+    alice.attack(object, damage);\n+    expect(object.health).toBe(expectedObjectHealth);\n+    expect(object.alive).toBe(expectedObjectAlive);\n+  });\n+});\n+\n+interface HealingScenario {\n+  name: string;\n+  objectMax: number;\n+  characterLevel: number;\n+  preDamage: number;\n+  expectedCharacterHealth: number;\n+  expectedObjectHealth: number;\n+  expectedObjectAlive: boolean;\n+}\n+\n+const healingScenarios: HealingScenario[] = [\n+  { name: 'object restores partial health',      objectMax: 500,  characterLevel: 1, preDamage: 200, expectedCharacterHealth: 1000, expectedObjectHealth: 300, expectedObjectAlive: true  },\n+  { name: 'object caps at character max',        objectMax: 100,  characterLevel: 1, preDamage: 50,  expectedCharacterHealth: 1000, expectedObjectHealth: 50,  expectedObjectAlive: true  },\n+  { name: 'object consumed entirely',            objectMax: 200,  characterLevel: 1, preDamage: 500, expectedCharacterHealth: 700,  expectedObjectHealth: 0,   expectedObjectAlive: false },\n+  { name: 'level 6 character heals to 1500',     objectMax: 1000, characterLevel: 6, preDamage: 800, expectedCharacterHealth: 1500, expectedObjectHealth: 200, expectedObjectAlive: true  },\n+];\n+\n+describe('healing object usage', () => {\n+  it.each(healingScenarios)('$name', ({ objectMax, characterLevel, preDamage, expectedCharacterHealth, expectedObjectHealth, expectedObjectAlive }) => {\n+    const target = new Character(characterLevel);\n+    const stranger = new Character(characterLevel);\n+    const object = new HealingObject(objectMax);\n+    if (preDamage > 0) stranger.attack(target, preDamage);\n+    const healer = new Character();\n+    healer.healWith(target, object);\n+    expect(target.health).toBe(expectedCharacterHealth);\n+    expect(object.health).toBe(expectedObjectHealth);\n+    expect(object.alive).toBe(expectedObjectAlive);\n+  });\n+\n+  it('cannot heal a dead character with a healing object', () => {\n+    const target = new Character();\n+    const stranger = new Character();\n+    stranger.attack(target, 5000);\n+    const object = new HealingObject(500);\n+    const healer = new Character();\n+    healer.healWith(target, object);\n+    expect(target.health).toBe(0);\n+    expect(target.alive).toBe(false);\n+    expect(object.health).toBe(500);\n+    expect(object.alive).toBe(true);\n+  });\n+});\n+\n+interface WeaponScenario {\n+  name: string;\n+  weaponMax: number;\n+  weaponDamage: number;\n+  uses: number;\n+  expectedTargetHealth: number;\n+  expectedWeaponHealth: number;\n+  expectedWeaponAlive: boolean;\n+}\n+\n+const weaponScenarios: WeaponScenario[] = [\n+  { name: 'single use deals weapon damage',           weaponMax: 3, weaponDamage: 100, uses: 1, expectedTargetHealth: 900, expectedWeaponHealth: 2, expectedWeaponAlive: true  },\n+  { name: 'weapon destroyed after final use',         weaponMax: 3, weaponDamage: 100, uses: 3, expectedTargetHealth: 700, expectedWeaponHealth: 0, expectedWeaponAlive: false },\n+  { name: 'using a destroyed weapon is a no-op',      weaponMax: 1, weaponDamage: 100, uses: 3, expectedTargetHealth: 900, expectedWeaponHealth: 0, expectedWeaponAlive: false },\n+];\n+\n+describe('magical weapon usage', () => {\n+  it.each(weaponScenarios)('$name', ({ weaponMax, weaponDamage, uses, expectedTargetHealth, expectedWeaponHealth, expectedWeaponAlive }) => {\n+    const alice = new Character();\n+    const target = new Character();\n+    const weapon = new MagicalWeapon(weaponMax, weaponDamage);\n+    for (let i = 0; i < uses; i++) alice.attackWith(target, weapon);\n+    expect(target.health).toBe(expectedTargetHealth);\n+    expect(weapon.health).toBe(expectedWeaponHealth);\n+    expect(weapon.alive).toBe(expectedWeaponAlive);\n+  });\n+});\n"}, {"hash": "65f6a92", "full": "65f6a92804b63872353297d08cc54c8995c24634", "author": "Claude Code", "date": "2026-05-28 14:44", "subject": "feat: phase 6 — level advancement via damage and factions", "body": "Adds damageTaken tracking on Character (cumulative absorbed damage,\npost-clamp). Level recomputes after every damage event and every\nfaction join, taking max(damage path, faction path) capped at 10.\nDamage thresholds follow (N-1)*N/2 * 1000; faction thresholds at\n3*(N-1) distinct factions. Dead characters do not level up.\n\nCo-Authored-By: Claude Opus 4.7 <noreply@anthropic.com>", "type": "green", "adds": 113, "dels": 1, "files": 2, "diff": "diff --git a/devill/src/character.ts b/devill/src/character.ts\nindex de94117..aa90c70 100644\n--- a/devill/src/character.ts\n+++ b/devill/src/character.ts\n@@ -6,6 +6,7 @@ export class Character implements Damageable {\n   health: number;\n   alive = true;\n   factions = new Set<string>();\n+  damageTaken = 0;\n \n   constructor(level = 1) {\n     this.level = level;\n@@ -18,6 +19,7 @@ export class Character implements Damageable {\n \n   join(faction: string): void {\n     this.factions.add(faction);\n+    this.recomputeLevel();\n   }\n \n   attack(target: Damageable, amount: number): void {\n@@ -54,8 +56,29 @@ export class Character implements Damageable {\n   }\n \n   private applyDamage(target: Damageable, amount: number): void {\n-    target.health = Math.max(0, target.health - amount);\n+    const before = target.health;\n+    target.health = Math.max(0, before - amount);\n     if (target.health === 0) target.alive = false;\n+    if (target instanceof Character) {\n+      target.damageTaken += before - target.health;\n+      target.recomputeLevel();\n+    }\n+  }\n+\n+  private recomputeLevel(): void {\n+    if (!this.alive) return;\n+    const next = Math.min(10, Math.max(this.damageLevel(), this.factionLevel()));\n+    if (next > this.level) this.level = next;\n+  }\n+\n+  private damageLevel(): number {\n+    let n = 1;\n+    while (n < 10 && this.damageTaken >= n * (n + 1) / 2 * 1000) n++;\n+    return n;\n+  }\n+\n+  private factionLevel(): number {\n+    return Math.floor(this.factions.size / 3) + 1;\n   }\n \n   private consumeWeapon(weapon: MagicalWeapon): void {\ndiff --git a/devill/tests/level-advancement.test.ts b/devill/tests/level-advancement.test.ts\nnew file mode 100644\nindex 0000000..64d653f\n--- /dev/null\n+++ b/devill/tests/level-advancement.test.ts\n@@ -0,0 +1,89 @@\n+import { describe, expect, it } from 'vitest';\n+import { Character } from '../src/character.js';\n+import { HealingObject, MagicalWeapon } from '../src/magical-object.js';\n+\n+function inflictDamage(target: Character, total: number): void {\n+  if (total % 50 !== 0) throw new Error('total must be multiple of 50');\n+  const attacker = new Character();\n+  const healer = new Character();\n+  const healingObject = new HealingObject(1_000_000);\n+  const hits = total / 50;\n+  const weapon = new MagicalWeapon(hits + 10, 50);\n+  for (let i = 0; i < hits; i++) {\n+    attacker.attackWith(target, weapon);\n+    healer.healWith(target, healingObject);\n+  }\n+}\n+\n+interface DamageLevelScenario {\n+  name: string;\n+  damageInflicted: number;\n+  expectedLevel: number;\n+}\n+\n+const damageLevelScenarios: DamageLevelScenario[] = [\n+  { name: 'no damage yet: level 1',          damageInflicted: 0,     expectedLevel: 1 },\n+  { name: '950 damage: still level 1',       damageInflicted: 950,   expectedLevel: 1 },\n+  { name: '1000 damage: level 2',            damageInflicted: 1000,  expectedLevel: 2 },\n+  { name: '2950 damage: level 2',            damageInflicted: 2950,  expectedLevel: 2 },\n+  { name: '3000 damage: level 3',            damageInflicted: 3000,  expectedLevel: 3 },\n+  { name: '6000 damage: level 4',            damageInflicted: 6000,  expectedLevel: 4 },\n+  { name: '10000 damage: level 5',           damageInflicted: 10000, expectedLevel: 5 },\n+  { name: '15000 damage: level 6',           damageInflicted: 15000, expectedLevel: 6 },\n+];\n+\n+describe('damage-based leveling', () => {\n+  it.each(damageLevelScenarios)('$name', ({ damageInflicted, expectedLevel }) => {\n+    const target = new Character();\n+    inflictDamage(target, damageInflicted);\n+    expect(target.level).toBe(expectedLevel);\n+    expect(target.alive).toBe(true);\n+  });\n+});\n+\n+interface FactionLevelScenario {\n+  name: string;\n+  distinctFactions: number;\n+  expectedLevel: number;\n+}\n+\n+const factionLevelScenarios: FactionLevelScenario[] = [\n+  { name: 'zero factions: level 1',                  distinctFactions: 0,  expectedLevel: 1  },\n+  { name: 'two factions: still level 1',             distinctFactions: 2,  expectedLevel: 1  },\n+  { name: 'three factions: level 2',                 distinctFactions: 3,  expectedLevel: 2  },\n+  { name: 'five factions: level 2',                  distinctFactions: 5,  expectedLevel: 2  },\n+  { name: 'six factions: level 3',                   distinctFactions: 6,  expectedLevel: 3  },\n+  { name: 'twenty-seven factions: level 10',         distinctFactions: 27, expectedLevel: 10 },\n+  { name: 'thirty factions: capped at level 10',     distinctFactions: 30, expectedLevel: 10 },\n+];\n+\n+describe('faction-based leveling', () => {\n+  it.each(factionLevelScenarios)('$name', ({ distinctFactions, expectedLevel }) => {\n+    const target = new Character();\n+    for (let i = 0; i < distinctFactions; i++) target.join(`F${i}`);\n+    expect(target.level).toBe(expectedLevel);\n+  });\n+});\n+\n+describe('level-advancement edge cases', () => {\n+  it('rejoining the same faction does not bump the count', () => {\n+    const target = new Character();\n+    for (let i = 0; i < 5; i++) target.join('Red');\n+    expect(target.level).toBe(1);\n+  });\n+\n+  it('dying at the level-up threshold does NOT level up', () => {\n+    const target = new Character();\n+    const stranger = new Character();\n+    stranger.attack(target, 5000);\n+    expect(target.alive).toBe(false);\n+    expect(target.level).toBe(1);\n+  });\n+\n+  it('crossing both paths takes the max level', () => {\n+    const target = new Character();\n+    inflictDamage(target, 1000);\n+    for (let i = 0; i < 6; i++) target.join(`F${i}`);\n+    expect(target.level).toBe(3);\n+  });\n+});\n"}]}}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const FOLDERS = Object.keys(DATA);
  const state = { folder: FOLDERS[0], index: {} };
  FOLDERS.forEach(function (f) { state.index[f] = 0; });

  const $ = function (id) { return document.getElementById(id); };
  const esc = function (s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  };

  function parseHashRoute() {
    const m = location.hash.match(/^#([a-z]+)\/(\d+)$/);
    if (m && DATA[m[1]]) {
      state.folder = m[1];
      const n = DATA[m[1]].commits.length;
      state.index[m[1]] = Math.min(Math.max(parseInt(m[2], 10) - 1, 0), n - 1);
    }
  }

  function parseDiff(text) {
    const files = [];
    let cur = null;
    text.split("\n").forEach(function (line) {
      if (line.indexOf("diff --git") === 0) {
        cur = { name: line, status: "modified", lines: [] };
        const m = line.match(/ b\/(.+)$/);
        if (m) cur.name = m[1];
        files.push(cur);
        return;
      }
      if (!cur) return;
      if (/^(index |old mode|new mode|similarity|copy |Binary files|--- |\+\+\+ )/.test(line)) return;
      if (line.indexOf("new file") === 0) { cur.status = "added"; return; }
      if (line.indexOf("deleted file") === 0) { cur.status = "deleted"; return; }
      if (line.indexOf("rename from") === 0) return;
      if (line.indexOf("rename to ") === 0) { cur.name = line.slice(10); return; }
      cur.lines.push(line);
    });
    return files;
  }

  function renderFile(file) {
    let html = '<div class="file"><div class="file-header">' +
      '<span class="file-status ' + file.status + '">' + file.status + "</span>" +
      "<span>" + esc(file.name) + "</span></div>" +
      '<table class="diff-table"><tbody>';
    let oldLn = 0;
    let newLn = 0;
    file.lines.forEach(function (line) {
      if (line === "") return;
      if (line.indexOf("@@") === 0) {
        const m = line.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
        if (m) { oldLn = parseInt(m[1], 10); newLn = parseInt(m[2], 10); }
        html += '<tr class="hunk"><td class="ln"></td><td class="ln"></td><td class="code">' + esc(line) + "</td></tr>";
        return;
      }
      const c = line.charAt(0);
      const rest = line.slice(1);
      if (c === "+") {
        html += '<tr class="add"><td class="ln"></td><td class="ln">' + newLn++ + '</td><td class="code">+' + esc(rest) + "</td></tr>";
      } else if (c === "-") {
        html += '<tr class="del"><td class="ln">' + oldLn++ + '</td><td class="ln"></td><td class="code">-' + esc(rest) + "</td></tr>";
      } else if (c === "\\") {
        html += '<tr class="metaline"><td class="ln"></td><td class="ln"></td><td class="code">' + esc(line) + "</td></tr>";
      } else {
        html += '<tr><td class="ln">' + oldLn++ + '</td><td class="ln">' + newLn++ + '</td><td class="code"> ' + esc(rest) + "</td></tr>";
      }
    });
    return html + "</tbody></table></div>";
  }

  function renderTabs() {
    const tabs = $("tabs");
    tabs.innerHTML = "";
    FOLDERS.forEach(function (f, i) {
      const d = DATA[f];
      const b = document.createElement("button");
      b.className = "tab" + (f === state.folder ? " active" : "");
      b.innerHTML = esc(d.label) + " <span class=\"sub\">· " + esc(d.tagline) +
        "</span><span class=\"count\">" + d.commits.length + "</span>";
      b.title = "Press " + (i + 1);
      b.onclick = function () { state.folder = f; render(); };
      tabs.appendChild(b);
    });
  }

  function renderTimeline() {
    const tl = $("timeline");
    tl.innerHTML = "";
    const commits = DATA[state.folder].commits;
    commits.forEach(function (c, i) {
      const t = document.createElement("button");
      t.className = "tick " + c.type + (i === state.index[state.folder] ? " active" : "");
      t.title = (i + 1) + ". " + c.subject;
      t.onclick = function () { state.index[state.folder] = i; render(); };
      tl.appendChild(t);
    });
  }

  function render() {
    const commits = DATA[state.folder].commits;
    const i = state.index[state.folder];
    const c = commits[i];
    renderTabs();
    renderTimeline();
    $("counter").textContent = (i + 1) + " / " + commits.length;
    $("badge").textContent = c.type;
    $("badge").className = "badge " + c.type;
    $("subject").textContent = c.subject;
    $("hash").textContent = c.hash;
    $("date").textContent = c.date;
    $("author").textContent = c.author;
    $("filecount").textContent = c.files + (c.files === 1 ? " file" : " files");
    $("adds").textContent = "+" + c.adds;
    $("dels").textContent = "−" + c.dels;
    const body = $("bodytext");
    if (c.body) { body.hidden = false; body.textContent = c.body; } else { body.hidden = true; }
    $("prev").disabled = i === 0;
    $("next").disabled = i === commits.length - 1;
    const files = parseDiff(c.diff);
    $("diff").innerHTML = files.length
      ? files.map(renderFile).join("")
      : '<div class="empty">No code changes in this commit.</div>';
    history.replaceState(null, "", "#" + state.folder + "/" + (i + 1));
    document.documentElement.style.setProperty("--chrome-h", $("chrome").offsetHeight + "px");
    window.scrollTo(0, 0);
  }

  function step(delta) {
    const commits = DATA[state.folder].commits;
    const next = state.index[state.folder] + delta;
    if (next < 0 || next >= commits.length) return;
    state.index[state.folder] = next;
    render();
  }

  $("prev").onclick = function () { step(-1); };
  $("next").onclick = function () { step(1); };

  window.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight" || e.key === "j") { e.preventDefault(); step(1); }
    else if (e.key === "ArrowLeft" || e.key === "k") { e.preventDefault(); step(-1); }
    else if (e.key === "Home") { e.preventDefault(); state.index[state.folder] = 0; render(); }
    else if (e.key === "End") { e.preventDefault(); state.index[state.folder] = DATA[state.folder].commits.length - 1; render(); }
    else if (e.key >= "1" && e.key <= String(FOLDERS.length)) {
      state.folder = FOLDERS[parseInt(e.key, 10) - 1];
      render();
    }
  });

  window.addEventListener("resize", function () {
    document.documentElement.style.setProperty("--chrome-h", $("chrome").offsetHeight + "px");
  });

  parseHashRoute();
  render();
})();
</script>
